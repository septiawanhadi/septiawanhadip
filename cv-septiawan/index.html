<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Septiawan Hadi Prasetyo</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --text: #f8fafc;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-secondary: #06b6d4;
      --glass-bg: rgba(13, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Bar */
    header {
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      transition: var(--transition);
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-light);
      transform: translateX(-2px);
    }

    h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #fff 30%, var(--accent-light) 70%, var(--accent-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
      transition: var(--transition);
    }

    .download-btn:hover {
      background: linear-gradient(135deg, var(--accent-light) 0%, #a5b4fc 100%);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    /* Viewer Area */
    .viewer-container {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #111827;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Responsive */
    @media (max-width: 600px) {
      header {
        padding: 10px 16px;
      }
      h1 {
        display: none; /* Hide title on phone to save space */
      }
      .back-btn, .download-btn {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="../" class="back-btn">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Kembali
    </a>
    <h1>CV - Septiawan Hadi Prasetyo</h1>
    <div class="actions">
      <a href="./CV-Septiawan-Hadi-Prasetyo.pdf" download class="download-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Unduh PDF
      </a>
    </div>
  </header>

  <div class="viewer-container">
    <iframe src="./CV-Septiawan-Hadi-Prasetyo.pdf" title="CV Septiawan Hadi Prasetyo"></iframe>
  </div>
</body>
</html>
