<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Septiawan Hadi Prasetyo</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(13, 18, 30, 0.75);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-secondary: #06b6d4;
      --glass-bg: rgba(13, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Bar */
    header {
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      transition: var(--transition);
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-light);
      transform: translateX(-2px);
    }

    h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #fff 30%, var(--accent-light) 70%, var(--accent-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
      transition: var(--transition);
    }

    .download-btn:hover {
      background: linear-gradient(135deg, var(--accent-light) 0%, #a5b4fc 100%);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    /* Viewer Area (Desktop) */
    .viewer-container {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #111827;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Mobile Fallback Container */
    .mobile-fallback {
      display: none;
      flex: 1;
      width: 100%;
      height: 100%;
      padding: 24px;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0f172a 0%, var(--bg) 100%);
      overflow-y: auto;
    }

    .fallback-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 36px 24px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(99, 102, 241, 0.05);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .fallback-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      display: grid;
      place-items: center;
      color: var(--accent-light);
      margin-bottom: 8px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
    }

    .fallback-card h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
    }

    .fallback-card p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .fallback-actions {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition);
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      color: #fff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .primary-btn:hover {
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
      transform: translateY(-1px);
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      color: var(--text);
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--text-muted);
    }

    /* Responsive Queries */
    @media (max-width: 768px) {
      .viewer-container {
        display: none;
      }
      .mobile-fallback {
        display: flex;
      }
      header {
        padding: 12px 16px;
      }
      h1 {
        display: none; /* Hide header text to make space */
      }
      .back-btn {
        padding: 8px 12px;
        font-size: 12px;
      }
      .actions {
        display: none; /* Hide top action buttons since they are in the card */
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="../" class="back-btn">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Kembali
    </a>
    <h1>CV - Septiawan Hadi Prasetyo</h1>
    <div class="actions">
      <a href="./CV-Septiawan-Hadi-Prasetyo.pdf" download class="download-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Unduh PDF
      </a>
    </div>
  </header>

  <!-- Desktop Embedded Viewer -->
  <div class="viewer-container">
    <iframe src="./CV-Septiawan-Hadi-Prasetyo.pdf" title="CV Septiawan Hadi Prasetyo"></iframe>
  </div>

  <!-- Mobile Premium Fallback Card -->
  <div class="mobile-fallback">
    <div class="fallback-card">
      <div class="fallback-icon">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <h2>CV Septiawan Hadi</h2>
      <p>Format dokumen PDF terdeteksi. Silakan buka langsung dokumen untuk pengalaman membaca yang optimal di layar seluler.</p>
      
      <div class="fallback-actions">
        <a href="./CV-Septiawan-Hadi-Prasetyo.pdf" target="_blank" class="btn primary-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          Buka CV (PDF)
        </a>
        <a href="./CV-Septiawan-Hadi-Prasetyo.pdf" download class="btn secondary-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Unduh Dokumen
        </a>
      </div>
    </div>
  </div>
</body>
</html>
